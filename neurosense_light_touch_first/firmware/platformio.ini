; NeuroSense BLE button box - Seeed XIAO ESP32C6
;
;   Production:  pio run -e release -t upload
;   Debugging:   pio run -e debug   -t upload   then   pio device monitor -e debug
;   Bench soak:  pio run -e debug_soak -t upload   (synthetic presses + forced disconnects)
;
; The official espressif32 platform lags on the C6, so this uses the pioarduino fork
; (Arduino-ESP32 core 3.x). Once a build works, pin the platform and library to exact
; versions (replace "stable" with a release tag and ^2.1.0 with the resolved version).

[platformio]
default_envs = release

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^2.1.0
build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:release]
; No debug code, no USB serial, smallest size.
build_type = release
build_flags =
    ${env.build_flags}
    -Os
    -DNS_DEBUG=0
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:debug]
; NS_DEBUG=1 enables all debug infrastructure (logger, memory/task reports, counters).
build_type = debug
build_flags =
    ${env.build_flags}
    -DNS_DEBUG=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_filters = esp32_exception_decoder

[env:debug_soak]
; Debug build plus self-test: fake presses every 2 s and a forced disconnect every 3 min.
extends = env:debug
build_flags =
    ${env:debug.build_flags}
    -DNS_DEBUG_SELFTEST=1
